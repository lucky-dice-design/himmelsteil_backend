name: himmelsteil-cms

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  directus:
    image: directus/directus:12.3.1
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      PUBLIC_URL: https://${DIRECTUS_DOMAIN}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      IP_TRUST_PROXY: "1"
      SESSION_COOKIE_SECURE: "true"
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      WEBSOCKETS_ENABLED: "false"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: "120"
      RATE_LIMITER_DURATION: "60"
      LOGIN_STALL_TIME: "1000"
      FILES_MAX_UPLOAD_SIZE: "20mb"
      TELEMETRY: "false"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    networks:
      - database
      - web

  contact:
    build:
      context: ./contact-service
    restart: unless-stopped
    environment:
      SMTP_HOST: smtp.ionos.de
      SMTP_PORT: "465"
      SMTP_USER: info@himmelsteil.de
      MAIL_FROM: himmelsteil Papeterie <info@himmelsteil.de>
      MAIL_TO: info@himmelsteil.de
      ALLOWED_ORIGINS: https://preview.himmelsteil.de,https://himmelsteil.de,https://www.himmelsteil.de
      DIRECTUS_URL: http://directus:8055
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 128
    secrets:
      - contact_smtp_password
      - contact_directus_token
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - directus
      - contact
    environment:
      DIRECTUS_DOMAIN: ${DIRECTUS_DOMAIN}
      PREVIEW_PASSWORD_HASH: ${PREVIEW_PASSWORD_HASH:?Preview password hash is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.production:/etc/caddy/Caddyfile.production:ro
      - /opt/himmelsteil-site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  database:
    internal: true
  web:

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
  caddy_data:
  caddy_config:

secrets:
  contact_smtp_password:
    file: ./secrets/contact_smtp_password
  contact_directus_token:
    file: ./secrets/contact_directus_token
